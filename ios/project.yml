# XcodeGen fallback spec. The committed Forge.xcodeproj already works with
# Xcode 16+ — only use this if you prefer to regenerate the project:
#   brew install xcodegen && cd ios && xcodegen generate
name: Forge
options:
  bundleIdPrefix: dev.forge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Forge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Forge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.forge.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    scheme:
      testTargets: []
